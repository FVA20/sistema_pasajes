<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>{% block title %}Reportes - Vía Pacífico{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: #2c3e50; color: white; padding: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; margin: 20px 0; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
        .stat-box { background: #3498db; color: white; padding: 20px; border-radius: 5px; text-align: center; }
        .stat-box h3 { font-size: 2em; margin-bottom: 10px; }
        .stat-box p { font-size: 0.9em; opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        table th { background: #34495e; color: white; }
        .btn { display: inline-block; padding: 10px 20px; background: #3498db; color: white; text-decoration: none; border-radius: 5px; margin: 5px; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>VÍA PACÍFICO</h1>
            <nav>
                <a href="{% url 'reportes:dashboard' %}" class="btn">Dashboard</a>
                <a href="{% url 'reportes:reporte_diario' %}" class="btn">Reporte Diario</a>
                <a href="{% url 'reportes:reporte_mensual' %}" class="btn">Reporte Mensual</a>
                <a href="{% url 'reportes:reporte_anual' %}" class="btn">Reporte Anual</a>
                <a href="{% url 'admin:index' %}" class="btn">Admin</a>
            </nav>
        </div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
